org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# API server
# ---------------------------------------------------------------------------
# The single place the backend URL is configured. Read by core/data at build
# time and compiled into BuildConfig.API_BASE_URL.
#
# The trailing slash is REQUIRED -- Retrofit drops the last path segment of a
# base URL without it. The build fails if it is missing.
#
#   emulator         http://10.0.2.2:8000/api/mobile/v1/   (host's localhost)
#   physical device  http://<your-LAN-IP>:8000/api/mobile/v1/
#   production       https://<your-domain>/api/mobile/v1/
#
# Release builds reject plain HTTP: cleartext is enabled only in the debug
# manifest, so the release value must be https://
#
# To override on one machine without touching this file (e.g. your own LAN IP),
# put the same key in local.properties -- it is git-ignored and wins.
khaidai.apiBaseUrl.debug=http://10.0.2.2:8000/api/mobile/v1/
khaidai.apiBaseUrl.release=https://dining.example.edu/api/mobile/v1/
